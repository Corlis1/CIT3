<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Login – NoCost</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body class="auth-body">

<div class="auth-card">
  <a href="index.html" class="auth-brand">🛒 NoCost</a>
  <h2>Welcome Back</h2>
  <p class="auth-sub">Sign in with your Philippine mobile number</p>
  <div class="phone-input-group">
    <span class="country-code">🇵🇭 +63</span>
    <input class="text-input phone-field" type="tel" placeholder="9XX XXX XXXX"/>
  </div>
  <input class="text-input" type="password" placeholder="Password"/>
  <div class="auth-options">
    <label><input type="checkbox"/> Remember me</label>
    <a href="#">Forgot password?</a>
  </div>
  <button class="btn-primary btn-block">Login</button>
  <p class="auth-switch">Don't have an account? <a href="register.html">Sign up</a></p>
</div>

</body>
</html>
