<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Sign Up – NoCost</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body class="auth-body">

<div class="auth-card">
  <a href="index.html" class="auth-brand">🛒 NoCost</a>
  <h2>Create Account</h2>
  <p class="auth-sub">Join NoCost — list anything for free.</p>
  <input class="text-input" type="text" placeholder="Full Name"/>
  <div class="phone-input-group">
    <span class="country-code">🇵🇭 +63</span>
    <input class="text-input phone-field" type="tel" placeholder="9XX XXX XXXX"/>
  </div>
  <input class="text-input" type="password" placeholder="Create Password"/>
  <input class="text-input" type="password" placeholder="Confirm Password"/>
  <div class="otp-row">
    <input class="text-input" type="text" placeholder="Enter OTP"/>
    <button class="btn-outline otp-btn">Send OTP</button>
  </div>
  <label class="checkbox-row">
    <input type="checkbox"/> I agree to NoCost's <a href="#">Terms & Conditions</a>
  </label>
  <button class="btn-primary btn-block" style="margin-top:16px;">Create Account</button>
  <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>
</div>

</body>
</html>
